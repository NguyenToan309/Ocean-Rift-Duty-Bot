# =====================================================================
# Homie Medic — Local development stack
# Run: docker compose up -d
# DB exposed on host port 5433 to avoid clashing with native PG on 5432.
# =====================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: duty_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER:-duty_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
      POSTGRES_DB:       ${DB_NAME:-duty_logger}
      TZ:                ${DEFAULT_TIMEZONE:-Asia/Ho_Chi_Minh}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - duty_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-duty_user} -d ${DB_NAME:-duty_logger}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: duty_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - duty_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  duty_pgdata:
  duty_redisdata:
