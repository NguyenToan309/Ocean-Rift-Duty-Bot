services:

  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    container_name: duty_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Bind 127.0.0.1 — chỉ host local truy cập được, không expose internet
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - duty_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: duty_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - duty_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Discord Bot ──
  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: duty_bot
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - duty_net
    volumes:
      - ./:/app

  # ── Web Dashboard (FastAPI) ──
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: duty_web
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"   # Chỉ bind localhost — Nginx đứng trước
    networks:
      - duty_net
    volumes:
      - ./:/app
      - export_files:/srv/duty-logger/exports

volumes:
  postgres_data:
  redis_data:
  export_files:

networks:
  duty_net:
    driver: bridge
