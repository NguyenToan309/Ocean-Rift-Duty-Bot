# =============================================================================
# Production override — dùng cùng với docker-compose.yml
#
# Usage trên VPS:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Khác base: thêm Nginx, restart=always thay unless-stopped, expose 80/443.
# =============================================================================

services:

  postgres:
    restart: always
    # Production: KHÔNG expose port — chỉ truy cập nội bộ qua Docker network
    ports: []

  redis:
    restart: always
    ports: []

  bot:
    restart: always
    # Logs rotation
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  web:
    restart: always
    # Web không cần expose ra ngoài — Nginx proxy vào
    ports: []
    expose:
      - "8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ── Nginx reverse proxy ──
  nginx:
    image: nginx:alpine
    container_name: duty_nginx
    restart: always
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./scripts/nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    networks:
      - duty_net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nginx_logs:
