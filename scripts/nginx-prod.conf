# =============================================================================
# Duty Logger — Production Nginx Config
# Đặt tại: /etc/nginx/sites-available/duty-logger
# Symlink:  ln -s ../sites-available/duty-logger /etc/nginx/sites-enabled/
#
# YOUR_DOMAIN sẽ được thay bằng domain thật khi deploy
# =============================================================================

# ── Rate limit zones ──
limit_req_zone $binary_remote_addr zone=duty_api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=duty_login:10m rate=10r/m;

# ── HTTP → HTTPS redirect ──
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS server ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    # SSL — sẽ được certbot inject
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers (FastAPI cũng set, nhưng add thêm ở đây cho chắc)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Request size limit (cho /log upload ảnh — max 5MB + overhead)
    client_max_body_size 8M;

    # Logs
    access_log /var/log/nginx/duty-logger.access.log;
    error_log  /var/log/nginx/duty-logger.error.log warn;

    # ── Auth login — rate limit chặt ──
    location /auth/login {
        limit_req zone=duty_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    location /auth/callback {
        limit_req zone=duty_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    # ── API — rate limit ──
    location /api/ {
        limit_req zone=duty_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    # ── Static files — cache aggressive ──
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_cache_valid 200 1d;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Health check (no rate limit) ──
    location /health {
        proxy_pass http://127.0.0.1:8000;
        access_log off;
    }

    # ── Default — pass to FastAPI ──
    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    # Block hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
