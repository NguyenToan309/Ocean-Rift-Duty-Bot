<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Homie Medic — Hệ thống quản lý chấm công và lịch trực ngành y" />
    <title>Homie Medic — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <!-- Fallback rendered nếu JS chưa mount — sẽ bị React thay thế ngay khi mount xong -->
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#020617;color:#94a3b8;font-family:system-ui,sans-serif;">
        <div style="text-align:center;">
          <div style="width:32px;height:32px;border:2px solid #3b82f6;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px;"></div>
          <p style="font-size:14px;">Đang khởi động Homie Medic…</p>
          <noscript>
            <p style="color:#f43f5e;margin-top:16px;">Trang này cần JavaScript. Vui lòng bật JavaScript trong trình duyệt.</p>
          </noscript>
        </div>
      </div>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
